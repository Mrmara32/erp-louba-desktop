name: Lecture des offres fournisseurs par e-mail

# Toutes les 30 minutes, demande à l'ERP de lire la boîte e-mail commune des offres fournisseurs :
# rattachement au fournisseur, lecture des prix par l'IA, création du fournisseur inconnu.
# Dépôt public : les minutes d'exécution sont gratuites (aucun coût Render ni GitHub payant).
# Secret requis dans ce dépôt : OFFRES_CRON_TOKEN (même valeur que la variable Render du même nom).
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lecture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Lire la boîte e-mail des offres
        env:
          OFFRES_CRON_TOKEN: ${{ secrets.OFFRES_CRON_TOKEN }}
        run: |
          [ -n "$OFFRES_CRON_TOKEN" ] || { echo "::error::Secret OFFRES_CRON_TOKEN absent de ce dépôt."; exit 1; }
          for url in "https://api.actifmarket.net" "https://erp-louba-backend.onrender.com"; do
            code=$(curl -sS --max-time 150 -o /tmp/r.json -w '%{http_code}' -X POST -H "X-Cron-Token: $OFFRES_CRON_TOKEN" "$url/api/offres-recues/lecture-programmee/" || echo 000)
            echo "$url -> $code"; head -c 400 /tmp/r.json 2>/dev/null; echo
            [ "$code" = "200" ] && exit 0
          done
          exit 1
