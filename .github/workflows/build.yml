name: Build ERP Desktop (Windows)

# Compile réellement l'exécutable Windows dans le cloud (machine Windows
# louée par GitHub), sans que vous ayez besoin d'un PC Windows vous-même.
#
# Déclenchement :
# - Automatique à chaque push sur main qui touche erp-desktop/ ou erp_project/
# - Manuel depuis l'onglet "Actions" du dépôt GitHub (bouton "Run workflow")
#
# Résultat : un artefact téléchargeable "ERP-Compta-Logistique-Setup"
# contenant l'installateur .exe prêt à distribuer, disponible dans
# l'onglet Actions -> ce run -> section "Artifacts", pendant 90 jours.

on:
  push:
    branches: [main]
    paths:
      - "erp-desktop/**"
      - "erp_project/**"
      - "erp-frontend/**"
  workflow_dispatch: {}

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer Node.js (pour builder le frontend)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Builder le frontend React
        working-directory: erp-frontend
        run: |
          npm ci
          npm run build

      - name: Installer les dépendances Python du shell desktop
        working-directory: erp-desktop
        run: pip install -r requirements.txt

      - name: Compiler l'exécutable (PyInstaller, --onedir)
        working-directory: erp-desktop
        run: python build.py

      - name: Installer Inno Setup
        run: choco install innosetup -y

      - name: Compiler l'installateur .exe final
        working-directory: erp-desktop/installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" setup.iss

      - name: Publier l'installateur comme artefact téléchargeable
        uses: actions/upload-artifact@v4
        with:
          name: ERP-Compta-Logistique-Setup
          path: erp-desktop/installer_output/*.exe
          retention-days: 90
