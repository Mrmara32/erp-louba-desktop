name: Build ERP Android (APK)

# Application Android = coque « Trusted Web Activity » qui ouvre https://actifmarket.net en plein écran.
# Le fichier ERP-ACTIFSYS.apk est ajouté à la dernière version publiée (même lien que les fichiers Windows/macOS/Linux).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: erp-desktop

      # La clé de signature vit dans le dépôt PRIVÉ du frontend (même accès que l'édition complète).
      - name: Récupérer la clé de signature (dépôt privé)
        id: cle
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: Mrmara32/erp-louba-frontend
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          path: frontend
          sparse-checkout: android-signing

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Le SDK Android est déjà présent sur les machines GitHub : on accepte les licences et on ajoute ce qu'il faut.
      - name: Préparer le SDK Android
        run: |
          SDKM="$(ls $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Compiler et signer l'APK
        working-directory: erp-desktop/android
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/frontend/android-signing/actifsys-release.jks
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: "1.${{ github.run_number }}"
        run: |
          if [ -f "$KEYSTORE_PATH" ]; then
            export KEYSTORE_PASSWORD="$(cat ${{ github.workspace }}/frontend/android-signing/mot-de-passe.txt)"
            echo "Clé de signature officielle (dépôt privé) utilisée."
          else
            echo "::warning::Jeton CROSS_REPO_TOKEN invalide : clé TEMPORAIRE utilisée. Renouvelez le jeton puis relancez pour une APK signée avec la clé officielle."
            export KEYSTORE_PATH="$RUNNER_TEMP/temporaire.jks"
            export KEYSTORE_PASSWORD="$(openssl rand -hex 16)"
            keytool -genkeypair -keystore "$KEYSTORE_PATH" -alias actifsys -keyalg RSA -keysize 2048 -validity 10000 -storepass "$KEYSTORE_PASSWORD" -keypass "$KEYSTORE_PASSWORD" -dname "CN=ACTIFSYSTEM SARLU, O=ACTIFSYSTEM, L=Conakry, C=GN"
          fi
          gradle --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../ERP-ACTIFSYS.apk

      - name: Empreinte de la clé (pour assetlinks.json)
        run: |
          $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)/apksigner verify --print-certs erp-desktop/ERP-ACTIFSYS.apk | grep -i "SHA-256"

      - uses: actions/upload-artifact@v4
        with:
          name: ERP-ACTIFSYS-apk
          path: erp-desktop/ERP-ACTIFSYS.apk

      - name: Ajouter l'APK à la dernière version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then TAG="${{ github.ref_name }}"; else TAG="$(gh release view --json tagName --jq .tagName)"; fi
          for i in $(seq 1 30); do gh release view "$TAG" >/dev/null 2>&1 && break; echo "version $TAG pas encore publiée..."; sleep 30; done
          gh release upload "$TAG" erp-desktop/ERP-ACTIFSYS.apk --clobber
          echo "APK ajouté à la version $TAG"
