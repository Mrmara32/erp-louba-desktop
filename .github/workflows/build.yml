name: Build ERP Desktop

# Se déclenche automatiquement à chaque push d'un tag de version (ex: v1.0.0),
# ou manuellement depuis l'onglet "Actions" de GitHub ("workflow_dispatch").
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Installer les dépendances système Linux (GTK + WebKit2)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-webkit2-4.1 libgirepository1.0-dev

      - name: Générer l'exécutable
        run: python build.py

      - name: Renommer l'artefact selon la plateforme
        shell: bash
        run: |
          mkdir -p artefact
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp dist/ERP-Compta-Logistique.exe artefact/ERP-Compta-Logistique-Windows.exe
          elif [ "${{ matrix.os }}" = "macos-latest" ]; then
            cp dist/ERP-Compta-Logistique artefact/ERP-Compta-Logistique-macOS
          else
            cp dist/ERP-Compta-Logistique artefact/ERP-Compta-Logistique-Linux
          fi

      - name: Publier l'exécutable
        uses: actions/upload-artifact@v4
        with:
          name: erp-desktop-${{ matrix.os }}
          path: artefact/*
